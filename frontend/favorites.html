<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - Mini Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h2>Mini Music</h2>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="home.html">Songs</a></li>
                <li><a href="playlist.html">My Playlists</a></li>
                <li><a href="favorites.html" class="active">Favorites</a></li>
                <li id="adminLink" style="display: none;"><a href="admin.html">Admin</a></li>
            </ul>
            <div class="user-info">
                <p id="userNameDisplay">User</p>
                <a href="#" id="logoutBtn" style="color: var(--text-secondary); font-size: 0.9rem;">Logout</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <h3 style="margin-bottom: 2rem;">My Favorite Songs</h3>
            <div id="favoritesGrid" class="cards-grid">
                <!-- Favorites injected here -->
            </div>
        </main>
    </div>

    <!-- Music Player -->
    <div class="music-player">
        <div class="now-playing">
            <img id="playerCover" src="" alt="Cover" style="display: none;">
            <div>
                <div id="playerTitle" class="song-title">Select a song</div>
                <div id="playerArtist" class="song-artist"></div>
            </div>
        </div>
        <div class="player-controls">
            <div class="control-buttons">
                <button class="control-btn" id="prevBtn">⏮</button>
                <button class="control-btn play-pause-btn" id="playPauseBtn">▶</button>
                <button class="control-btn" id="nextBtn">⏭</button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <span id="durationTime">0:00</span>
            </div>
        </div>
        <div class="volume-control">
            <span style="margin-right: 0.5rem;">🔊</span>
            <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="1" style="width: 100px;">
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script src="js/app.js"></script>
    <script src="js/songs.js"></script>
</body>

</html>
