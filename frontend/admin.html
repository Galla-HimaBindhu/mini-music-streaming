<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Mini Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h2>Mini Music</h2>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="home.html">Songs</a></li>
                <li><a href="playlist.html">My Playlists</a></li>
                <li><a href="favorites.html">Favorites</a></li>
                <li id="adminLink"><a href="admin.html" class="active">Admin</a></li>
            </ul>
            <div class="user-info">
                <p id="userNameDisplay">Admin User</p>
                <a href="#" id="logoutBtn" style="color: var(--text-secondary); font-size: 0.9rem;">Logout</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <h3>Admin Dashboard</h3>
            <div style="background-color: var(--card-bg); padding: 1.5rem; border-radius: 8px; margin-top: 1rem;">
                <h4>Add New Song</h4>
                <form id="addSongForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem;">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="songTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Artist</label>
                        <input type="text" id="songArtist" required>
                    </div>
                    <div class="form-group">
                        <label>Album</label>
                        <input type="text" id="songAlbum">
                    </div>
                    <div class="form-group">
                        <label>Genre</label>
                        <input type="text" id="songGenre">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Audio URL (Must be valid direct link to mp3)</label>
                        <input type="url" id="songAudioUrl" required>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Cover Image URL</label>
                        <input type="url" id="songCoverImage">
                    </div>
                    <button type="submit" class="btn btn-primary" style="grid-column: span 2;">Add Song</button>
                </form>
            </div>

            <div style="margin-top: 2rem;">
                <h4>Existing Songs</h4>
                <table id="adminSongsTable">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Artist</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Songs injected here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Admin specific logic
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('musicAppUser'));
            if (!user || user.role !== 'ADMIN') {
                window.location.href = 'home.html';
                return;
            }

            fetchSongsAdmin();

            document.getElementById('addSongForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const songData = {
                    title: document.getElementById('songTitle').value,
                    artist: document.getElementById('songArtist').value,
                    album: document.getElementById('songAlbum').value,
                    genre: document.getElementById('songGenre').value,
                    audioUrl: document.getElementById('songAudioUrl').value,
                    coverImage: document.getElementById('songCoverImage').value || 'https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?w=500&q=80'
                };

                try {
                    const res = await fetch(`${API_URL}/songs`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(songData)
                    });
                    if (res.ok) {
                        alert('Song added successfully');
                        e.target.reset();
                        fetchSongsAdmin();
                    }
                } catch (err) {
                    console.error('Error adding song', err);
                }
            });
        });

        async function fetchSongsAdmin() {
            try {
                const res = await fetch(`${API_URL}/songs`);
                const songs = await res.json();
                const tbody = document.querySelector('#adminSongsTable tbody');
                tbody.innerHTML = '';
                songs.forEach(song => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${song.title}</td>
                        <td>${song.artist}</td>
                        <td>
                            <button onclick="deleteSong(${song.id})" class="btn btn-danger" style="padding: 5px 10px; font-size: 0.8rem;">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteSong(id) {
            if (confirm('Are you sure you want to delete this song?')) {
                try {
                    const res = await fetch(`${API_URL}/songs/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        fetchSongsAdmin();
                    }
                } catch (err) {
                    console.error(err);
                }
            }
        }
    </script>
</body>
</html>
